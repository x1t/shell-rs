# A release: push a tag `v<version>` matching Cargo.toml's version. Windows only:
# this fork ships no macOS or Linux packages, though the code still builds there.
#
#   verify   the tag, the CHANGELOG section, the update keys
#   windows  per-user Inno Setup installer (unsigned for now)
#   publish  (environment `release`, approved by hand) signs the packages,
#            creates the GitHub release `v<version>` with them, and only
#            then replaces the channel's manifest, which is what clients
#            follow: an asset of the `update-manifest` release, made the
#            first time and kept out of "Latest"
#
# A tag with a pre-release (v0.3.0-beta.1) goes to the beta channel only. A
# stable release also becomes the beta channel's, unless beta is ahead.
#
# Running it by hand (workflow_dispatch) builds and packages from the
# current commit without publishing, to try the pipeline.
#
# Secrets, see docs/release.md:
#   environment `release`: MINISIGN_SECRET_KEY, MINISIGN_PASSWORD
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version and channel
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: |
          version=${{ steps.version.outputs.version }}
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section ## [$version]"
            exit 1
          fi
          cat notes.md
      - name: The build knows the update keys
        run: |
          if grep -q 'pub const TRUSTED_KEYS: &\[&str\] = &\[\];' src/update/build_info.rs; then
            echo "::error::src/update/build_info.rs has no TRUSTED_KEYS: a release would reject every update"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  windows:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_UPDATE_CHANNEL: ${{ needs.verify.outputs.channel }}
      SHELLRS_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1
      - name: Build
        shell: bash
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bins
      - name: Installer
        shell: pwsh
        run: |
          # windows-2025 ships Inno Setup 6.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y; }
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=$env:GITHUB_WORKSPACE\target\release" `
            "/O$env:GITHUB_WORKSPACE\dist" packaging\windows\shellrs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    needs: [verify, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      CHANNEL: ${{ needs.verify.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
      # The release whose assets are the channels' manifests. Shipped
      # clients read src/update/build_info.rs's MANIFEST_URL, which names
      # it: it never changes.
      MANIFESTS: update-manifest
      SHELLRS_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p dist
          cp artifacts/windows/* dist/
          cp artifacts/notes/notes.md notes.md
          ls -l dist
      - name: Signing key
        env:
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/minisign.key"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/minisign.key" >> "$GITHUB_ENV"
      - name: Sign the packages
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          cd dist
          for file in ShellRS-*; do
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$MINISIGN_KEY_FILE" \
              -m "$file" -t "shellrs $VERSION $file"
          done
          sha256sum ShellRS-* > SHA256SUMS
      - name: GitHub release
        run: |
          prerelease=""
          [ "$CHANNEL" = beta ] && prerelease="--prerelease"
          gh release create "v$VERSION" dist/* --title "ShellRS $VERSION" \
            --notes-file notes.md $prerelease
      - name: Manifests, last
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          # The first release makes it. A pre-release, not "Latest": the
          # releases page and the badge keep showing the newest version.
          if ! gh release view "$MANIFESTS" >/dev/null 2>&1; then
            gh release create "$MANIFESTS" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Update manifests" \
              --notes "ShellRS checks the manifests here for updates. Don't delete this release."
          fi
          publish() {
            packaging/make-manifest.sh "$VERSION" "$1" notes.md dist "$1.json"
            gh release upload "$MANIFESTS" "$1.json" --clobber
          }
          publish "$CHANNEL"
          if [ "$CHANNEL" = stable ]; then
            # Beta follows stable unless it is already ahead.
            beta=$(curl -fsSL "$SHELLRS_REPOSITORY_URL/releases/download/$MANIFESTS/beta.json" | jq -r .manifest | jq -r .version || true)
            [ -n "$beta" ] || beta=0.0.0
            if python3 - "$VERSION" "$beta" <<'EOF'
          import sys
          def key(version):
              core, _, pre = version.partition("-")
              parts = [int(part) for part in core.split(".")]
              # A release sorts after its pre-releases.
              return parts, (1,) if not pre else (0, pre)
          sys.exit(0 if key(sys.argv[1]) > key(sys.argv[2]) else 1)
          EOF
            then
              publish beta
            fi
          fi
