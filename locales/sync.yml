_version: 2

# 云同步: hosts, credentials, forwards, snippets and settings kept in step
# through the user's own shell-rs-server (设置 › 云同步).

sync.known_hosts_not_saved:
  zh-CN: 同步来的主机信任文件未能保存：%{error}
  en: "Couldn’t save the known hosts file synced from another device: %{error}"

sync.error.bad_server:
  zh-CN: 服务器地址要以 https:// 开头（本机的服务器可以用 http://）
  en: The server address must start with https:// (http:// only for a server on this computer)
sync.error.missing_fields:
  zh-CN: 请填写用户名和密码
  en: Enter the username and password
sync.error.wrong_password:
  zh-CN: 用户名或密码不对
  en: The username or password is wrong
sync.error.network:
  zh-CN: 连不上同步服务器：%{reason}
  en: "Couldn’t reach the sync server: %{reason}"
sync.error.too_many_attempts:
  zh-CN: 登录失败次数太多，过 15 分钟再试
  en: Too many failed logins. Try again in 15 minutes.
sync.error.server:
  zh-CN: 同步服务器出错（%{status}）
  en: The sync server had a problem (%{status})
sync.error.not_sync_server:
  zh-CN: 这个地址不是 ShellRS 同步服务器
  en: This address isn’t a ShellRS sync server
sync.error.unsafe_server:
  zh-CN: 同步服务器要求的密钥派生参数不安全，已拒绝登录
  en: The sync server asked for weak key derivation settings, so ShellRS didn’t log in
sync.error.wrong_key:
  zh-CN: 云端数据是用别的密码加密的，请重新登录
  en: The data in the cloud was encrypted with another password. Log in again.
sync.error.keychain:
  zh-CN: 无法读写系统钥匙串：%{reason}
  en: "Couldn’t use the system keychain: %{reason}"

sync.status.log_in_again:
  zh-CN: 登录已失效，请重新登录
  en: The login has expired. Log in again.
sync.status.off:
  zh-CN: 未开启
  en: "Off"
sync.status.signed_out:
  zh-CN: 未登录
  en: Not logged in
sync.status.starting:
  zh-CN: 正在登录…
  en: Logging in…
sync.status.syncing:
  zh-CN: 正在同步…
  en: Syncing…
sync.status.synced:
  zh-CN: 已同步
  en: Synced
sync.status.synced_at:
  zh-CN: 已同步，%{time}
  en: Synced %{time}

sync.settings.account:
  zh-CN: 账号
  en: Account
sync.settings.account_description:
  zh-CN: 主机、分组、凭据（含密码和私钥）、端口转发、命令片段、设置和主机信任文件，经你自己的 shell-rs-server 在各台电脑间同步。数据在本机加密后才上传，服务器上只有密文；忘了密码，云端的数据就解不开了。
  en: Hosts, groups, credentials (passwords and private keys included), port forwards, snippets, settings and the known hosts file stay in step across your computers through your own shell-rs-server. They’re encrypted on this computer before they leave it, so the server only ever holds ciphertext. If you forget the password, the data in the cloud can’t be decrypted.
sync.settings.server:
  zh-CN: 服务器地址
  en: Server address
sync.settings.username:
  zh-CN: 用户名
  en: Username
sync.settings.password:
  zh-CN: 密码
  en: Password
sync.settings.log_in:
  zh-CN: 登录
  en: Log in
sync.settings.log_out:
  zh-CN: 退出登录
  en: Log out
sync.settings.sync_now:
  zh-CN: 立即同步
  en: Sync now
sync.settings.status:
  zh-CN: 状态
  en: Status
